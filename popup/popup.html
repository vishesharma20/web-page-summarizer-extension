<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Webpage Summarizer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="wordmark">
        <span class="wordmark-text">Summar<span class="highlight-swipe">ize</span>r</span>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Open settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.6"/>
          <path d="M19.4 13.5c.04-.33.06-.66.06-1s-.02-.67-.06-1l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.4.96a7.4 7.4 0 0 0-1.72-1l-.36-2.55a.5.5 0 0 0-.5-.43h-3.84a.5.5 0 0 0-.5.43l-.36 2.55c-.63.24-1.2.58-1.72 1l-2.4-.96a.5.5 0 0 0-.6.22L2.75 9.28a.5.5 0 0 0 .12.64L4.9 11.5c-.04.33-.06.66-.06 1s.02.67.06 1l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.4.31.6.22l2.4-.96c.52.42 1.09.76 1.72 1l.36 2.55c.05.25.26.43.5.43h3.84c.24 0 .45-.18.5-.43l.36-2.55a7.4 7.4 0 0 0 1.72-1l2.4.96c.2.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64L19.4 13.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <p class="tagline">One click. The gist of any page, distilled.</p>

    <main class="app-main">
      <!-- Idle state -->
      <section id="idleState" class="state">
        <button id="summarizeBtn" class="primary-btn">
          <span class="btn-label">Summarize this page</span>
        </button>
        <p class="hint" id="providerHint">Using built-in local summarizer</p>
      </section>

      <!-- Loading state -->
      <section id="loadingState" class="state hidden">
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-text" id="loadingText">Reading the page…</p>
      </section>

      <!-- Result state -->
      <section id="resultState" class="state hidden">
        <div class="result-meta">
          <span id="pageTitle" class="page-title"></span>
          <span id="methodBadge" class="badge"></span>
        </div>
        <ul id="summaryList" class="summary-list"></ul>
        <div class="result-actions">
          <button id="copyBtn" class="secondary-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            <span id="copyLabel">Copy summary</span>
          </button>
          <button id="redoBtn" class="text-btn">Summarize again</button>
        </div>
      </section>

      <!-- Error state -->
      <section id="errorState" class="state hidden">
        <p class="error-text" id="errorText"></p>
        <button id="retryBtn" class="secondary-btn">Try again</button>
      </section>
    </main>

    <footer class="app-footer">
      <span id="wordCount"></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
